<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mercado Pago - Segunda Vuelta</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #91d7ec;
            color: white;
            text-align: center;
            padding: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        .contenedor {
            width: calc(100% - 30px);
            max-width: 700px;
            margin: 40px auto;
        }

        .pago {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.18);
        }

        .pago h2 {
            text-align: center;
            color: #0088cc;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .datos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        .logo-mp {
            width: 180px;
            height: 120px;
            object-fit: contain;
        }

        .informacion {
            text-align: left;
        }

        .informacion p {
            margin: 8px 0;
            font-size: 16px;
        }

        .informacion .titulo {
            font-weight: bold;
            color: #666;
            font-size: 14px;
        }

        .alias {
            background: #f1faff;
            border: 2px solid #00a9e0;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 18px;
            font-weight: bold;
            color: #0088cc;
            display: inline-block;
        }

        .volver {
            display: block;
            width: fit-content;
            margin: 25px auto 0;
            padding: 10px 18px;
            background: #0088cc;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.2s ease;
        }

        .volver:hover {
            background: #006fa8;
        }

        .aviso {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        @media (max-width: 600px) {

            .pago {
                padding: 20px;
            }

            .datos {
                flex-direction: column;
                gap: 20px;
            }

            .informacion {
                text-align: center;
            }

            .logo-mp {
                width: 160px;
                height: 100px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Segunda Vuelta</h1>
    </header>

    <div class="contenedor">

        <div class="pago">

            <h2>Datos para pagar</h2>

            <div class="datos">

                <img 
                    src="mercadopago.png" 
                    alt="Logo Mercado Pago"
                    class="logo-mp"
                >

                <div class="informacion">

                    <p class="titulo">
                        Nombre del titular
                    </p>

                    <p>
                        Cecilia Casas
                    </p>

                    <p class="titulo">
                        Alias
                    </p>

                    <p class="alias">
                        celiann.0
                    </p>

                </div>

            </div>

            <p class="aviso">
                Una vez realizada la transferencia, podés enviarnos
                el comprobante por WhatsApp.
            </p>

            <a href="inicio.html" class="volver">
                Volver al inicio
            </a>

        </div>

    </div>

</body>

</html>
