<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Segunda Vuelta</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #91d7ec;
            color: white;
            text-align: center;
        }

        .encabezado1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 20px;
        }

        .encabezado1 img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
        }

        .encabezado1 h1 {
            margin: 0;
            font-size: 26px;
        }

        .encabezado2 {
            display: flex;
            justify-content: center;
            background-color: #0088cc;
            gap: 10px;
            padding: 10px 0;
        }

        .encabezado2 a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .encabezado2 a:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .encabezado2 a.activo {
            color: white;
        }

        .btn-carrito-nav {
            background-color: #ff9800;
            border-radius: 20px !important;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            background: #7bcbe0;
        }

        .link-btn {
            border: none;
            color: white;
            font-size: 13px;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .whatsapp {
            background: #25d366;
        }

        .mercadopago {
            background: #00a9e0;
        }

        .instagram {
            background: #e1306c;
        }

        .productos {
            width: 1100px;
            max-width: calc(100% - 30px);
            margin: 21px auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.18);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .card img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            display: block;
        }

        .card-content {
            padding: 10px 11px 11px;
        }

        .card h2 {
            font-size: 13px;
            margin: 0 0 6px;
        }

        .card p {
            font-size: 11px;
            line-height: 1.3;
            min-height: 30px;
            margin: 0 0 8px;
            color: #444;
        }

        .precio {
            color: #c080bb;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 8px;
            min-height: 18px;
        }

        .carrito {
            width: 100%;
            border: none;
            background: #ebb1e6;
            color: white;
            font-weight: bold;
            font-size: 11px;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
        }

        .carrito:hover {
            background: #c080bb;
        }

        .carrito.agregado {
            background: #4CAF50 !important;
        }

        .carrito.repetido {
            background: #ff9800 !important;
        }


        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .modal-content h2 {
            margin-top: 0;
            font-size: 18px;
            color: #333;
        }

        .lista-carrito {
            list-style: none;
            padding: 0;
            margin: 15px 0;
        }

        .item-carrito {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }

        .item-carrito button {
            background: #ff4d4d;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 2px 6px;
            cursor: pointer;
        }

        .total-carrito {
            font-weight: bold;
            text-align: right;
            font-size: 15px;
            margin-top: 10px;
        }

        .acciones-modal {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-cerrar,
        .btn-vaciar {
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            flex: 1;
        }

        .btn-cerrar {
            background: #888;
        }

        .btn-vaciar {
            background: #e74c3c;
        }

        @media (max-width: 900px) {
            .productos {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 620px) {
            .encabezado1 {
                flex-direction: column;
            }

            .encabezado2 {
                flex-wrap: wrap;
            }

            .productos {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 430px) {
            .productos {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        const contenedor = document.getElementById("productos");

        productos.forEach((producto) => {
            const card = document.createElement("article");
            card.className = "card";

            card.innerHTML = `
                <img src="${producto.imagen}" alt="${producto.nombre}">
                <div class="card-content">
                    <h2>${producto.nombre}</h2>
                    <p>${producto.descripcion}</p>
                    <div class="precio">${producto.precioTexto}</div>
                    <button class="carrito" type="button" data-precio="${producto.precio}">Agregar al carrito</button>
                </div>
            `;
            contenedor.appendChild(card);
        });

        let carrito = [];
        const contadorSpan = document.getElementById("contador-carrito");
        const modal = document.getElementById("modal-carrito");
        const btnVerCarrito = document.getElementById("btn-ver-carrito");
        const btnCerrar = document.getElementById("btn-cerrar");
        const btnVaciar = document.getElementById("btn-vaciar");
        const listaCarrito = document.getElementById("lista-carrito");
        const totalSpan = document.getElementById("total-carrito");

        function formatearPrecio(numero) {
            return "\$" + numero.toLocaleString("es-AR");
        }


        contenedor.addEventListener("click", (e) => {
            if (e.target.classList.contains("carrito")) {
                const boton = e.target;
                const card = boton.closest(".card");
                const nombre = card.querySelector("h2").textContent;
                const precio = Number(boton.dataset.precio);

                const existe = carrito.some(item => item.nombre === nombre);

                if (existe) {
                    boton.textContent = "¡Ya en el carrito!";
                    boton.classList.add("repetido");
                    setTimeout(() => {
                        boton.textContent = "Agregar al carrito";
                        boton.classList.remove("repetido");
                    }, 1200);
                } else {
                    carrito.push({ nombre, precio });
                    actualizarCarritoUI();

                    boton.textContent = "¡Agregado! ✓";
                    boton.classList.add("agregado");
                    setTimeout(() => {
                        boton.textContent = "Agregar al carrito";
                        boton.classList.remove("agregado");
                    }, 1200);
                }
            }
        });

        function actualizarCarritoUI() {
            contadorSpan.textContent = carrito.length;
            listaCarrito.innerHTML = "";

            if (carrito.length === 0) {
                listaCarrito.innerHTML = "<li>El carrito está vacío.</li>";
                totalSpan.textContent = "Total: \$0";
                return;
            }

            let total = 0;
            carrito.forEach((item, index) => {
                total += item.precio;
                const li = document.createElement("li");
                li.className = "item-carrito";
                li.innerHTML = `
                    <span>${item.nombre} - ${formatearPrecio(item.precio)}</span>
                    <button onclick="eliminarDelCarrito(${index})">X</button>
                `;
                listaCarrito.appendChild(li);
            });

            totalSpan.textContent = "Total: " + formatearPrecio(total);
        }

        window.eliminarDelCarrito = function(index) {
            carrito.splice(index, 1);
            actualizarCarritoUI();
        };

        btnVerCarrito.addEventListener("click", () => { modal.style.display = "flex"; });
        btnCerrar.addEventListener("click", () => { modal.style.display = "none"; });
        btnVaciar.addEventListener("click", () => { carrito = []; actualizarCarritoUI(); });
        modal.addEventListener("click", (e) => { if (e.target === modal) modal.style.display = "none"; });
    </script>
